# Конфиг шага 5: динамика кластеров во времени.

input:
  features: data/processed/features.parquet
  edges: data/processed/network/edges_cosine_k10.parquet

seed: 42
n_clusters: 6

# Временное сглаживание сети: S_t = (1 - alpha) * A_t + alpha * S_(t-1)
# alpha = 0 - каждый месяц кластеризуется независимо; чем больше alpha, тем сильнее память о прошлом
alpha_grid: [0.0, 0.3, 0.5, 0.7, 0.85]
alpha: 0.5                  # значение для итоговой типологии

event_share: 0.3            # доля состава, начиная с которой фиксируется разделение или слияние

output:
  dir: data/processed/dynamics
  report: reports/dynamics.md
