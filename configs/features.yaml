# Конфиг шага 1: сборка таблицы МО x месяц x признаки.

input:
  path: data/raw/hackathonlicence/consumption.parquet
  format: long                    # одна строка = МО x месяц x категория

columns:
  mo_id: territory_id             # id муниципалитета
  month: date                     # месяц в виде "2023-01"
  category: category              # название категории трат
  value: value                    # сумма трат
  wide_categories: []

# категория с общим итогом: от неё считаются доли, остаток идёт в "Прочее_share"
total_category: "Все категории"

# категории, которые нужно выбросить совсем
exclude_categories: []

# постоянные признаки МО (без месяца)
static:
  - path: data/raw/hackathonlicence/market_access.parquet
    mo_id: territory_id
    columns: [market_access]
    log: true                     # берём логарифм: распределение сильно скошено

filters:
  min_month_coverage: 1.0         # только МО со всеми 24 месяцами
  max_interp_gap: 2

standardize: per_month            # z-score внутри каждого месяца

output:
  features: data/processed/features.parquet
  audit: reports/data_audit.md
